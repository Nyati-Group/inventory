# Local MongoDB as a single-node replica set (Prisma needs one for transactions).
#   docker compose up -d
#   .env → MONGODB_URI="mongodb://localhost:27017/?replicaSet=rs0&directConnection=true"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  mongodata:
